<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>{{{ PRODUCT_NAME }}}</title>
  <style>
    html, body { margin:0; width:100%; height:100%; background:#181824; overflow:hidden; }
    #unity-canvas { width:100%; height:100%; display:block; }
    #loading { position:absolute; inset:0; display:grid; place-items:center; color:white; font:20px sans-serif; pointer-events:none; }
  </style>
  <script>
    window.cgShowError = function (message) {
      window.cgError = message;
      var loading = document.getElementById('loading');
      loading.style.display = 'grid';
      loading.textContent = message;
    };
  </script>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="loading">Loading…</div>
  <script src="Build/{{{ LOADER_FILENAME }}}"></script>
  <script>
    createUnityInstance(document.getElementById('unity-canvas'), {
      dataUrl: 'Build/{{{ DATA_FILENAME }}}',
      frameworkUrl: 'Build/{{{ FRAMEWORK_FILENAME }}}',
      codeUrl: 'Build/{{{ CODE_FILENAME }}}',
#if MEMORY_FILENAME
      memoryUrl: 'Build/{{{ MEMORY_FILENAME }}}',
#endif
#if SYMBOLS_FILENAME
      symbolsUrl: 'Build/{{{ SYMBOLS_FILENAME }}}',
#endif
      streamingAssetsUrl: 'StreamingAssets',
      companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      showBanner: function (message, type) { if (type === 'error') window.cgShowError(message); }
    }, function (progress) {
      document.getElementById('loading').textContent = 'Loading… ' + Math.round(progress * 100) + '%';
    }).then(function (instance) {
      window.unityInstance = instance;
      if (!window.cgError) document.getElementById('loading').style.display = 'none';
      instance.Module.canvas.focus();
    }).catch(function (error) { window.cgShowError(String(error)); });
  </script>
</body>
</html>
